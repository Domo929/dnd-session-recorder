version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dndrec
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: dndrec
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dndrec"]
      interval: 10s
      timeout: 5s
      retries: 5

  dnd-recorder:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      - DATABASE_URL=postgresql://dndrec:devpassword@postgres:5432/dndrec

      # AI Provider Selection
      - AI_TRANSCRIPTION_PROVIDER=${AI_TRANSCRIPTION_PROVIDER:-openai}
      - AI_SUMMARY_PROVIDER=${AI_SUMMARY_PROVIDER:-openai}

      # OpenAI Configuration (used when *_PROVIDER=openai)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_SUMMARY_MODEL=${OPENAI_SUMMARY_MODEL:-gpt-4o}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}

      # Google Generative AI Configuration (used when *_PROVIDER=google)
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - GOOGLE_SUMMARY_MODEL=${GOOGLE_SUMMARY_MODEL:-gemini-2.5-flash}
      - GOOGLE_TRANSCRIPTION_MODEL=${GOOGLE_TRANSCRIPTION_MODEL:-gemini-2.5-flash}

      # Local Whisper (whisper.cpp) Configuration (used when AI_TRANSCRIPTION_PROVIDER=whisper-local)
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      - WHISPER_MODELS_DIR=${WHISPER_MODELS_DIR:-/app/whisper-models}
      - WHISPER_USE_CUDA=${WHISPER_USE_CUDA:-false}

      # NextAuth Configuration (Required)
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

      # Google OAuth Configuration (Optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_GOOGLE_ENABLED=${NEXT_PUBLIC_GOOGLE_ENABLED}

      # File Upload Configuration
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - CORS_ORIGIN=${CORS_ORIGIN}

      # Node Environment
      - NODE_ENV=production
    volumes:
      # Persist uploads and downloaded whisper models (postgres has its own volume above)
      - ./data/uploads:/app/uploads
      - ./data/whisper-models:/app/whisper-models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres:
    driver: local
  uploads:
    driver: local